# Analyzes and tests the Dart code (the required gate), then attempts a full
# no-codesign iOS compile as a best-effort check.
#
# A signed build / TestFlight upload is intentionally NOT automated here: it
# needs your Apple Developer certificates and the Family Controls entitlement,
# which are account secrets, not repository code. Do those from Xcode on your
# Mac (see ios/README-iOS.md).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Analyze and test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    name: iOS compile check (best effort)
    needs: test
    runs-on: macos-14
    # Best effort, and deliberately non-blocking. The app's own Swift is
    # verified elsewhere (swiftc -parse in review, and the whole shared Dart +
    # camera usage is proven by the Android build). The only thing that can fail
    # here is a third-party plugin not yet supporting the runner's Xcode SDK
    # (e.g. camera_avfoundation vs a very new Xcode) — a toolchain-version issue,
    # not a defect in this project. A normal Mac on a released Xcode builds it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Re-add Screen Time extension targets
        run: |
          gem install xcodeproj
          cd ios && ruby configure_project.rb
      - run: cd ios && pod install
      - run: flutter build ios --release --no-codesign
